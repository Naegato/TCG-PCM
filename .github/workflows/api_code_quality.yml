name: PHP Quality Check

on:
  pull_request:
    paths:
      - 'api/**'

env:
  WITH_DOCKER: 0

jobs:
  install-deps:
    name: Install Composer Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
        working-directory: api

  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    needs: install-deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Run format
        run: make format-dry-run

      - name: Run lint
        run: make lint

  symfony-lint:
    name: Symfony Lint
    runs-on: ubuntu-latest
    needs: install-deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Run Symfony Lint
        run: make symfony-lint
