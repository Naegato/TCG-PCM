<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#0d3b3a"/>
      <stop offset="100%" stop-color="#03100f"/>
    </radialGradient>
  </defs>

  <rect width="500" height="700" fill="url(#bg)"/>

  <!-- target reticle -->
  <g fill="none" stroke="#7CFC9C" opacity="0.7">
    <circle cx="250" cy="360" r="220" stroke-width="4"/>
    <circle cx="250" cy="360" r="160" stroke-width="3"/>
    <line x1="250" y1="120" x2="250" y2="180" stroke-width="4"/>
    <line x1="250" y1="540" x2="250" y2="600" stroke-width="4"/>
    <line x1="10" y1="360" x2="70" y2="360" stroke-width="4"/>
    <line x1="430" y1="360" x2="490" y2="360" stroke-width="4"/>
  </g>

  <!-- slime drips -->
  <g fill="#7CFC9C" opacity="0.85">
    <path d="M170 470 q-6 30 0 46 q6 -16 0 -46 Z"/>
    <path d="M330 480 q-6 34 0 50 q6 -16 0 -50 Z"/>
    <path d="M250 500 q-7 40 0 58 q7 -18 0 -58 Z"/>
  </g>

  <!-- bomb body -->
  <circle cx="250" cy="360" r="150" fill="#111"/>
  <ellipse cx="200" cy="310" rx="45" ry="28" fill="#fff" opacity="0.1"/>

  <!-- goo coating -->
  <path d="M120 380 Q250 460 380 380 Q250 430 120 380 Z" fill="#7CFC9C" opacity="0.55"/>

  <!-- fuse -->
  <path d="M250 210 Q300 165 270 120" stroke="#111" stroke-width="14" fill="none" stroke-linecap="round"/>
  <polygon points="270,90 300,125 265,140" fill="#ffb703"/>

  <!-- crosshair dot -->
  <circle cx="250" cy="360" r="10" fill="#7CFC9C"/>
</svg>
