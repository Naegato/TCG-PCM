<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#4a2a00"/>
      <stop offset="100%" stop-color="#1a0d00"/>
    </radialGradient>
    <radialGradient id="body" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#e8a317"/>
    </linearGradient>
  </defs>

  <rect width="500" height="700" fill="url(#bg)"/>

  <!-- starburst -->
  <g fill="#ffb703" opacity="0.9">
    <polygon points="250,60 270,220 250,380 230,220"/>
    <polygon points="90,330 250,310 410,330 250,350"/>
    <polygon points="140,140 265,260 385,140 265,220" opacity="0.7"/>
    <polygon points="140,520 265,400 385,520 265,440" opacity="0.7"/>
  </g>

  <!-- monkey tail -->
  <path d="M370 380 Q460 400 440 480 Q420 550 350 540" stroke="#5a3a1a" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- monkey ears -->
  <circle cx="150" cy="220" r="42" fill="#5a3a1a"/>
  <circle cx="150" cy="220" r="24" fill="#c98b4a"/>
  <circle cx="350" cy="220" r="42" fill="#5a3a1a"/>
  <circle cx="350" cy="220" r="24" fill="#c98b4a"/>

  <!-- bomb body -->
  <circle cx="250" cy="340" r="150" fill="url(#body)"/>
  <ellipse cx="200" cy="290" rx="45" ry="28" fill="#ffffff" opacity="0.12"/>

  <!-- gold crown band -->
  <path d="M120 340 Q250 300 380 340 L370 380 Q250 345 130 380 Z" fill="url(#gold)"/>

  <!-- fuse -->
  <path d="M250 190 Q290 140 260 100" stroke="#3a2a10" stroke-width="14" fill="none" stroke-linecap="round"/>
  <polygon points="260,70 285,105 255,120 270,90" fill="#ffdd55"/>
  <polygon points="255,80 275,95 250,115 245,95" fill="#ff8c00"/>
</svg>
