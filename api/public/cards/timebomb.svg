<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#3a0808"/>
      <stop offset="100%" stop-color="#120202"/>
    </radialGradient>
    <radialGradient id="body" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>
  </defs>

  <rect width="500" height="700" fill="url(#bg)"/>

  <!-- warning rings -->
  <circle cx="250" cy="350" r="220" fill="none" stroke="#7a1010" stroke-width="4" opacity="0.5"/>
  <circle cx="250" cy="350" r="260" fill="none" stroke="#7a1010" stroke-width="3" opacity="0.3"/>

  <!-- bomb body -->
  <circle cx="250" cy="360" r="150" fill="url(#body)"/>
  <ellipse cx="200" cy="310" rx="45" ry="28" fill="#ffffff" opacity="0.1"/>

  <!-- fuse -->
  <path d="M250 210 Q300 160 270 110" stroke="#1a1a1a" stroke-width="14" fill="none" stroke-linecap="round"/>
  <polygon points="270,80 300,115 265,130 250,100" fill="#ff5a1f"/>

  <!-- clock face inset -->
  <circle cx="250" cy="360" r="92" fill="#f4ecd8" stroke="#1a1a1a" stroke-width="10"/>
  <g stroke="#1a1a1a" stroke-width="6" stroke-linecap="round">
    <line x1="250" y1="360" x2="250" y2="300"/>
    <line x1="250" y1="360" x2="295" y2="380"/>
  </g>
  <circle cx="250" cy="360" r="8" fill="#c1121f"/>

  <!-- digital countdown -->
  <g transform="translate(190,470)">
    <rect x="0" y="0" width="120" height="56" rx="8" fill="#150202" stroke="#c1121f" stroke-width="4"/>
    <text x="60" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="34" fill="#ff2d2d" font-weight="bold">003</text>
  </g>
</svg>
