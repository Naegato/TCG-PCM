<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1f4a2a"/>
      <stop offset="100%" stop-color="#0a1a0e"/>
    </radialGradient>
  </defs>

  <rect width="500" height="700" fill="url(#bg)"/>

  <!-- floating dice pips -->
  <g fill="#e8f5e9">
    <rect x="80" y="120" width="46" height="46" rx="8" transform="rotate(-15 103 143)"/>
    <rect x="360" y="150" width="40" height="40" rx="8" transform="rotate(20 380 170)"/>
    <rect x="340" y="480" width="44" height="44" rx="8" transform="rotate(12 362 502)"/>
  </g>
  <g fill="#1f4a2a">
    <circle cx="103" cy="143" r="5"/>
    <circle cx="380" cy="170" r="4"/>
    <circle cx="352" cy="492" r="4"/>
    <circle cx="372" cy="512" r="4"/>
  </g>

  <!-- bomb body -->
  <circle cx="250" cy="360" r="150" fill="#111"/>
  <ellipse cx="200" cy="310" rx="45" ry="28" fill="#fff" opacity="0.1"/>

  <!-- fuse -->
  <path d="M250 210 Q300 165 270 120" stroke="#111" stroke-width="14" fill="none" stroke-linecap="round"/>
  <polygon points="270,90 300,125 265,140" fill="#8bd450"/>

  <!-- goofy troll face -->
  <g>
    <circle cx="205" cy="340" r="22" fill="#fff"/>
    <circle cx="295" cy="340" r="22" fill="#fff"/>
    <circle cx="215" cy="345" r="10" fill="#111"/>
    <circle cx="280" cy="335" r="10" fill="#111"/>
    <path d="M180 400 Q250 460 320 400 Q250 440 180 400 Z" fill="#fff"/>
    <path d="M190 400 Q250 430 310 400" stroke="#111" stroke-width="6" fill="none"/>
  </g>

  <!-- big question mark -->
  <text x="250" y="620" text-anchor="middle" font-family="Georgia, serif" font-size="90" fill="#8bd450" font-weight="bold">?</text>
</svg>
