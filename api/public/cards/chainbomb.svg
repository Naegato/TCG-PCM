<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#2a2f38"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </radialGradient>
  </defs>

  <rect width="500" height="700" fill="url(#bg)"/>

  <!-- chain links -->
  <g fill="none" stroke="#9aa3ad" stroke-width="14">
    <ellipse cx="250" cy="300" rx="24" ry="34" transform="rotate(20 250 300)"/>
    <ellipse cx="250" cy="360" rx="24" ry="34" transform="rotate(-20 250 360)"/>
    <ellipse cx="250" cy="420" rx="24" ry="34" transform="rotate(20 250 420)"/>
  </g>

  <!-- left bomb -->
  <g>
    <circle cx="140" cy="230" r="90" fill="#111"/>
    <ellipse cx="112" cy="200" rx="28" ry="18" fill="#fff" opacity="0.1"/>
    <path d="M140 145 Q170 110 150 80" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
    <polygon points="150,55 175,85 145,95" fill="#ffb703"/>
  </g>

  <!-- right bomb -->
  <g>
    <circle cx="360" cy="500" r="90" fill="#111"/>
    <ellipse cx="332" cy="470" rx="28" ry="18" fill="#fff" opacity="0.1"/>
    <path d="M360 415 Q390 380 370 350" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
    <polygon points="370,325 395,355 365,365" fill="#ffb703"/>
  </g>

  <!-- spark jumping between the two -->
  <polygon points="200,290 260,340 220,345 280,410 235,370 260,400" fill="#ffe066"/>
</svg>
